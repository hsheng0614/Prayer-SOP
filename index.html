<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>十神线上参拜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: full-screen 3D temple; HUD on top, ritual tray at bottom, modals for forms & info. Deliberately single dark theme (temple at night, candlelight). */
:root{
  --bg:#120b09; --panel:rgba(27,16,12,.9); --panel2:rgba(255,236,210,.06); --line:rgba(226,182,92,.28);
  --ink:#f5ead9; --muted:#c6b198; --gold:#e6b95e; --cin:#d4472f; --jade:#68b897; --warn:#f2a64a;
  --display:"Noto Serif SC","Songti SC","STSong",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.6;margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#hud>*{pointer-events:auto}
.brand{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 12px 7px 8px;min-width:0}
.seal{display:inline-grid;place-items:center;width:34px;height:34px;flex:none;background:var(--cin);color:#fff3e0;font-family:var(--display);font-weight:900;font-size:19px;border-radius:6px}
.brand b{display:block;font-family:var(--display);font-size:15px;letter-spacing:.04em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.hudR{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hb{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
.hb:hover{border-color:var(--gold)}
#score{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px}
#score b{color:var(--gold);font-variant-numeric:tabular-nums;font-size:15px}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);right:max(16px,env(safe-area-inset-right,0px));width:min(340px,calc(100% - 32px));display:grid;gap:8px;z-index:45;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--jade);border-radius:10px;padding:9px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:tin .25s ease-out}
.toast b{display:block;font-family:var(--display);font-size:14.5px}
.toast span{color:var(--muted);font-size:13px}
.toast.warn{border-left-color:var(--warn)} .toast.warn b{color:var(--warn)}
.toast.info{border-left-color:var(--gold)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
#bubble{position:fixed;z-index:22;top:calc(env(safe-area-inset-top,0px) + 74px);left:max(16px,env(safe-area-inset-left,0px));width:min(330px,calc(100% - 32px));
  background:rgba(250,238,215,.95);color:#3a1f12;border-radius:14px;padding:12px 14px;font-family:var(--display);font-size:14px;line-height:1.7;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#bubble small{display:block;font-family:var(--body);color:#8a5a3a;font-size:11.5px;letter-spacing:.1em;margin-bottom:2px}
#tray{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.trayIn{pointer-events:auto;width:min(980px,100%);max-height:min(40vh,380px);overflow:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:16px;padding:12px 16px 16px;display:grid;gap:10px}
.prog{display:flex;gap:4px;flex-wrap:wrap}
.prog i{width:18px;height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
.prog i.d{background:var(--jade)} .prog i.c{background:var(--gold)}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.th h2{margin:0;font-family:var(--display);font-size:19px;letter-spacing:.04em;color:var(--gold)}
.thR{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.skip{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:4px}
#trayMain .act{padding:7px 14px}
.acts.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.act.tile{justify-items:center;text-align:center;padding:6px 5px 7px;gap:1px;align-content:start;min-width:0}
.act.tile img{width:50px;height:50px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.act.tile span{font-size:13px;line-height:1.3}
.act.tile small{font-size:10.5px;line-height:1.3;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.tile.done{background:rgba(104,184,151,.13)}
#trayDesc{margin:0;color:var(--ink);max-width:70ch}
#trayBody{display:grid;gap:10px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{display:grid;gap:1px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;min-width:0;font-size:14.5px}
.act small{color:var(--muted);font-size:12px}
.act:hover:not(:disabled){border-color:var(--gold);background:rgba(230,185,94,.12)}
.act.primary{background:var(--cin);border-color:var(--cin);color:#fff8ee;font-weight:700}
.act.primary small{color:#ffe1cf}
.act.done{border-color:var(--jade);color:var(--jade)}
.act:disabled{opacity:.4;cursor:not-allowed}
.glabel{font-size:11.5px;letter-spacing:.12em;color:var(--muted);margin-bottom:5px}
.grp.traps{border-top:1px dashed var(--line);padding-top:9px}
.grp.traps .act{border-style:dashed;font-size:13px;padding:5px 11px}
body.busy #trayBody .act,body.busy #trayMain .act{pointer-events:none;opacity:.45}
.qbox{display:grid;gap:4px;max-width:520px}
.qbox span{font-size:12px;color:var(--muted)}
input,textarea{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font:inherit;width:100%}
.result{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-width:620px}
.result b{grid-row:span 2;font-family:var(--display);font-size:26px;color:var(--gold);width:2.4em;text-align:center}
.result.r-阴 b{color:var(--muted)} .result.r-笑 b{color:var(--warn)}
.result em{font-style:normal;font-size:12px;color:var(--muted)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-width:620px}
.card b{color:var(--gold)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--warn),var(--cin));width:0}
#modal{position:fixed;inset:0;z-index:50;background:rgba(8,4,3,.62);display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.sheet{position:relative;width:min(580px,100%);max-height:100%;overflow:auto;background:#1d120e;border:1px solid var(--line);border-radius:16px;padding:22px 22px 24px;display:grid;gap:10px}
.sheet h2{margin:0;font-family:var(--display);font-size:22px;color:var(--gold);text-wrap:balance;padding-right:30px}
.sheet h3{margin:8px 0 0;font-family:var(--display);font-size:15.5px;color:var(--ink)}
.sheet p{margin:0;color:var(--ink)}
.sheet ul,.sheet ol{margin:0;padding-left:1.2em;display:grid;gap:3px}
.sheet .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:18px;line-height:1}
.fine{font-size:12px;color:var(--muted)}
.alias{color:var(--muted);font-size:13px}
.sop li.d{color:var(--jade)} .sop li.c{color:var(--gold);font-weight:700}
.sop li span{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
form.rep{display:grid;gap:10px}
form.rep label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label,.chk{display:flex!important;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--ink)!important;cursor:pointer}
.chips input,.chk input{width:auto;accent-color:var(--cin)}
.err{color:var(--warn);font-size:13px;min-height:1em}
.poem{display:flex;flex-direction:row-reverse;justify-content:center;gap:14px;background:#f6ead2;color:#3a1f12;border-radius:10px;padding:16px;font-family:var(--display);font-size:18px;line-height:1.35}
.poem span{writing-mode:vertical-rl;letter-spacing:.12em}
.lv{display:inline-block;background:var(--cin);color:#fff;border-radius:6px;padding:1px 9px;font-size:13px;font-weight:700}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.fu{justify-self:center;width:min(220px,80%);background:#f3d36a;color:#b3261e;border:3px solid #b3261e;border-radius:6px;padding:16px 12px;text-align:center;font-family:var(--display);display:grid;gap:6px}
.fu b{font-size:26px;letter-spacing:.2em;writing-mode:vertical-rl;justify-self:center}
.fu small{font-size:12px;color:#7a1a12}
.compass{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:330px}
.compass .act{text-align:center;justify-items:center}
.compass .mid{display:grid;place-items:center;font-family:var(--display);color:var(--muted);font-size:13px}
#intro{position:fixed;inset:0;z-index:60;overflow:auto;background:linear-gradient(180deg,rgba(14,8,6,.5),rgba(14,8,6,.93) 48%);
  padding:calc(env(safe-area-inset-top,0px) + 40px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(16px,env(safe-area-inset-left,0px))}
.introIn{max-width:900px;margin:0 auto;display:grid;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--gold);margin:0}
#intro h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,48px);letter-spacing:.03em;text-wrap:balance}
.lede{margin:0;color:var(--ink);max-width:62ch;font-size:15px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dcard{display:grid;gap:2px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.dcard b{font-family:var(--display);font-size:16px}
.dcard small{color:var(--muted);font-size:11.5px}
.dcard.on{border-color:var(--gold);background:rgba(230,185,94,.14)}
.pick{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.pick h2{margin:0;font-family:var(--display);font-size:24px;color:var(--gold)}
.pick p{margin:0}
.start{justify-self:start;background:var(--cin);border:0;color:#fff8ee;font-weight:700;border-radius:10px;padding:11px 22px;font-size:16px;cursor:pointer}
.start:disabled{opacity:.5;cursor:wait}
#vowNote{background:rgba(104,184,151,.12);border:1px solid var(--jade);border-radius:10px;padding:10px 14px}
@media (max-width:560px){
  .brand span{max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hb{padding:5px 10px}
  .trayIn{max-height:44vh;padding:10px 12px 12px}
  .act{font-size:13.5px;padding:7px 11px}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>

<div id="stage"></div>
<header id="hud">
  <div class="brand"><span class="seal" id="hudSeal">福</span><div><b id="hudName">福德祠 · 大伯公</b><span id="hudStep">准备参拜</span></div></div>
  <div class="hudR">
    <div id="score" title="诚心值：犯禁忌会扣分">诚心 <b id="scoreN">100</b></div>
    <button class="hb" data-panel="bg">背景</button>
    <button class="hb" data-panel="taboo">禁忌</button>
    <button class="hb" data-panel="sop">SOP</button>
    <button class="hb" id="switchBtn">换一尊</button>
    <button class="hb" id="sndBtn">声音 开</button>
  </div>
</header>
<div id="bubble" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="tray" hidden>
  <div class="trayIn">
    <div class="prog" id="prog"></div>
    <div class="th"><h2 id="trayTitle"></h2><div class="thR"><button class="skip" id="skipBtn">卡住了？跳过这一步</button><div id="trayMain" class="acts"></div></div></div>
    <p id="trayDesc"></p>
    <div id="trayBody"></div>
  </div>
</div>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><button class="x" data-m="close" aria-label="关闭">×</button><div id="modalBody" style="display:grid;gap:10px"></div></div></div>
<div id="intro">
  <div class="introIn">
    <p class="eyebrow">线上拜神 · 马来西亚华人信仰体验</p>
    <h1>今天，想拜哪一尊？</h1>
    <p class="lede">一步一步体验传统的拜神礼仪：净手、龙门进庙、摆供品、上香、禀告、掷筊、求签、烧金纸，最后从虎门出庙。每尊神的供品、禁忌和仪式都不一样；做错了，也会告诉你为什么。</p>
    <div id="vowNote" hidden></div>
    <div class="dgrid" id="dgrid"></div>
    <div class="pick" id="pick"></div>
    <p class="fine">内容整理自公开资料，写的是“常见做法”，各庙习俗或有不同，以当地庙宇为准。Generated with Claude AI — please review before distribution.</p>
  </div>
</div>

 bg:`<p>道教北斗九星（北斗七星加辅、弼二星）的神格化，传为斗母元君的九个儿子，掌管人间生死、消灾解厄。九皇爷诞是东南亚华人的重大节庆，在马来西亚、新加坡和泰国南部最盛。</p>
<h3>九皇不一定有神像</h3><p>在新马，九皇大帝常以香炉代表，供在只有特定人员能进入的内殿里；有的庙用牌位，也有的庙立神像。所以这里的神坛上是牌位和香炉，不是人像。</p>
<h3>在马来西亚</h3><p>吉隆坡安邦南天宫约创建于 1862 年，是九皇信仰的重要中心；槟城的斗母宫也很有名。</p>
<h3>重要日子（农历）</h3><ul><li>八月最后一天：到海边或河边恭迎九皇</li><li>九月初一至初九：九皇斋期</li><li>九月初九夜：过火，随后送驾回海边</li></ul>`,

 bg:`<p>“财神”是一组神明的统称。文财神多指比干或范蠡，武财神多指赵公明（关公有时也被算作武财神）。“五路财神”指东、南、西、北、中五个方位都能得财。</p>
<h3>迎财神</h3><p>马来西亚华人在农历新年最常拜财神，很多人按通胜（黄历）上的财神方位，在新年子时开门迎接。通胜上的“财神方位”每天都不同，依当天的天干而定。</p>

 p.s.position.y+=dt*(.13+.06*k);p.s.position.x+=Math.sin(T*1.3+p.seed)*dt*.035;p.s.position.z+=Math.cos(T*1.1+p.seed)*dt*.02;const sc=p.size+k*p.grow;p.s.scale.set(sc,sc,1);p.s.material.opacity=.32*(k<.12?k/.12:1-k);}}

function camTo(pts,tgt,dur){const start=cam.pos.clone();const arr=[start];pts.forEach(p=>{const v=new V3(...p);if(v.distanceTo(arr[arr.length-1])>1e-3)arr.push(v);});
 if(arr.length<2)arr.push(start.clone().add(new V3(0,1e-3,0)));
 const curve=new THREE.CatmullRomCurve3(arr,false,'catmullrom',.5);const t0=cam.tgt.clone(),t1=new V3(...tgt);const y0=cam.yaw,p0=cam.pitch,z0=cam.zoom;
 const d=dur!=null?dur:clamp(curve.getLength()*.35,.8,4);
 return tween(d,k=>{const e=ease(k);cam.pos.copy(curve.getPointAt(e));cam.tgt.lerpVectors(t0,t1,e);cam.yaw=y0*(1-e);cam.pitch=p0*(1-e);cam.zoom=z0+(1-z0)*e;});}

 v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(gn,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o2.connect(v).connect(a.destination);o2.start(t);o2.stop(t+dur+.05);}
function noise(dur,freq,q,gn,delay=0){const a=ac();if(!a||!soundOn)return;const t=a.currentTime+delay;const n=Math.floor(a.sampleRate*dur);const b=a.createBuffer(1,n,a.sampleRate);const dd=b.getChannelData(0);for(let i=0;i<n;i++)dd[i]=Math.random()*2-1;

  if(r==='圣'){S.qianOK=true;S.qmiss=0;toast('ok','圣杯','神明确认就是这一支签。');showQian();}else{S.qmiss++;toast('info',r+'杯','不是圣杯，表示不是这一支。把签放回去，重新摇。');S.qianNo=null;W.qs.visible=false;}
  await camTo([[1.5,1.55,-2.9]],[2.6,1.0,-4.2],1.2);hideJiao();}),
 showQian:()=>showQian(),
 lamp:k=>run(async()=>{const L=W.templeStatue.userData.lamps;const n=k==='all'?9:S.lamps+1;while(S.lamps<n){L[S.lamps].visible=true;S.lamps++;tone(520+S.lamps*40,.6,.05);await wait(k==='all'?.25:.4);}
  if(S.lamps===9){bell();toast('ok','九灯齐亮','九皇灯象征北斗九星，点灯祈求消灾解厄、延年益寿。');}}),
 peach:()=>run(async()=>{const p=new THREE.Group();mk(sph(.06,16,12),M('#f2a39a',{rough:.6}),0,0,0,p);mk(sph(.03,10,8),M('#e25b5b'),0,.04,.02,p);
  const e=W.target.localToWorld(new V3(-.15,1.5,.4));await flyTo(p,handStart(),e,1,.3);OBJ.extra.push(p);await nod();S.peach=true;toast('ok','献上蟠桃','大圣爷点头收下了。');}),
 gift:k=>run(async()=>{const t=TOYS[k].b();const[gx,gz]=SC.gift;t.position.set(gx,SC.top+.3,gz);t.scale.setScalar(.01);scene.add(t);OBJ.extra.push(t);
  await tween(.45,q=>{t.position.y=SC.top+.3*(1-easeOut(q));t.scale.setScalar(.01+.99*easeOut(q));});clack(.12);S.gift=k;W.spinToy=t.userData.spin||null;toast('ok','送上'+TOYS[k].name,'祈求三太子保佑家里的小孩平安长大。');}),
 toast:()=>run(async()=>{const c=new THREE.Mesh(cyl(.02,.014,.025,14),porcelain());const e=new V3(0,TOP+.0125,-4.6);await flyTo(c,handStart(),e,.8,.15);OBJ.extra.push(c);
  const a=W.target.userData.arm;if(a){await tween(.8,q=>{a.rotation.x=-.9*ease(q);a.rotation.z=.25*ease(q);});showBubble('济公','好酒！喝了这一杯，烦恼少一半。');await wait(1.4);await tween(.8,q=>{a.rotation.x=-.9*(1-ease(q));a.rotation.z=.25*(1-ease(q));});}
  S.toast=true;toast('ok','敬酒','济公举起酒葫芦回敬了你。');}),
 amt:v=>{S.amt=+v;render();},
 donate:()=>run(async()=>{await coinDrop();S.donated=true;toast('ok','香油钱投好了',S.amt?`RM ${S.amt}，随喜功德。`:'随喜功德。');}),
 wait:()=>run(async()=>{await timelapse();S.halfShown=true;toast('ok','香已烧过一半','可以烧金纸、收供品了。');}),
 paper:id=>{const g=d.gold.find(q=>q.id===id);if(!g.ok)return taboo('paper_'+id,'烧'+g.label,g.taboo,5);S.paper=id;toast('ok',g.label,g.note);render();},
 burn:()=>run(async()=>{await camTo([[-1.6,1.7,-.6],[-3.4,1.7,1.2],[-3.5,1.7,2.8],[-3.4,1.7,5.2]],[-5.2,1.0,8.2],4.2);await burnPaper(d.gold.find(q=>q.id===S.paper).ch);S.goldDone=true;toast('ok','金纸化完了','金纸化成灰，表示答谢已经送到。');}),
 backIn:()=>run(async()=>{await camTo([[-1,1.7,7],[3.5,1.7,5],[3.5,1.7,2.6],[3.4,1.7,1.2],[2,1.7,-.2],SC.views.altar.p],SC.views.altar.t,6);toast('info','龙门进、虎门出','回到殿内也走龙门。');S.step++;}),
 collect:()=>run(async()=>{await collectAll();S.collected=true;toast('ok','收好了','带回家和家人一起吃，就是「分福气」。');}),
 out:w=>{if(w==='dragon')return taboo('dragonOut','从龙门出庙','出庙走虎门，也就是「龙进虎出」。从殿内往外看，虎门在你的右手边。',3);
  if(w==='mid')return taboo('midDoor','走中门','中门一般留给神明和重要仪式，信众多从两侧的门进出。',3);
  run(async()=>{toast('ok','虎门出庙','龙进虎出，有始有终。');await camTo([[-1.8,1.7,-.4],[-3.4,1.7,1.2],[-3.5,1.7,3.2],[-2,1.8,9],FRONT.p],FRONT.t,5.2);S.step++;render();showSummary();});},
 summary:()=>showSummary(),
 kanhuo:()=>run(async()=>{await camTo([[0,1.8,9.5]],[0,1.3,4.6],2);openModal(`<h2>看火</h2><p>槟城海珠屿大伯公庙每年正月十四夜举行“看火”：庙方观察香炉的火势，占卜新一年的运势。下面是模拟体验。</p><p class="fine">关掉这个窗口后，看看天公炉的火。</p>`,()=>run(kanhuoFire));}),
 jieku:()=>{const amt=[888,1688,3888,8888][Math.floor(Math.random()*4)];openModal(`<h2>观音借库</h2><p>每年农历正月廿六“观音开库”，信众到观音庙的“金银库”取一封写有金额的利是，叫“借库”，象征向观音借财运；翌年开库前再回来“还库”，传统上建议连续借三年。</p>
  <div class="fu" style="background:#c0251d;color:#f3d36a;border-color:#f3d36a"><small style="color:#f3d36a">观音库</small><b>借库</b><small style="color:#f3d36a">RM ${amt.toLocaleString()}</small></div>
  <p class="fine">香港盛行，马来西亚部分庙宇也有。这里是模拟，金额只是象征。</p>`);},
 jhinfo:()=>openModal(`<h2>恭迎、过火、送驾</h2><h3>恭迎</h3><p>农历八月最后一天，信众到海边或河边迎接九皇，相信神明经由水路而来。</p><h3>过火</h3><p>九月初九夜，部分信众赤脚走过炭火，象征净化。这是有危险的仪式，由庙方安排，平台不鼓励模仿。</p><h3>送驾</h3><p>过火之后，信众把九皇送回海边或河边，斋期才算圆满，之后才开斋。</p>`),
 restart:()=>run(async()=>{closeModal();await resetScene();await camTo([FRONT.p],FRONT.t,2.5);}),
 switch:()=>{closeModal();openIntro();},
 trap:k=>{if(k==='eat')return taboo('eat','先偷吃供品','拜完之前不可以先吃供品。等仪式结束、收了供品，带回家再吃，叫「分福气」。',8);
  if(k==='point')return taboo('point','用手指指神像','不可用手指指着神像，这被视为不敬。想表达敬意，合十或鞠躬就好。',5);
  if(k==='sit')return taboo('sit','靠着神桌坐','不可坐或倚靠神桌，也不要跨过供品。累了可以到旁边的椅子休息。',5);}
};
function speak(text,lang,title,sub){try{if(!('speechSynthesis' in window))throw 0;const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u);toast('info',title,sub);}
 catch(e){toast('info','无法朗读','这个浏览器不支持语音朗读。心里默念也可以。');}}
async function kanhuoFire(){const lvl=Math.floor(Math.random()*3);W.tgFire.target=.15;crackle(1);await wait(1.2);W.tgFire.target=[.35,.7,1][lvl];crackle(2.5);await wait(3.2);
 const t=[['火势较弱','传统解读为凡事宜谨慎保守，稳中求进。'],['火势平稳','传统解读为一年平顺，按部就班。'],['火势旺盛','传统解读为新一年运势兴旺。']][lvl];
 openModal(`<h2>${t[0]}</h2><p>${t[1]}</p><p class="fine">这是模拟体验，结果随机，仅供娱乐。真正的看火在农历正月十四夜，由庙方观察解读。</p>`);await wait(2);W.tgFire.target=0;}
function showQian(){const q=QIAN[S.qianNo-1];openModal(`<h2>第 ${S.qianNo} 签 <span class="lv">${q.lv}</span></h2><div class="poem">${q.p.map(l=>`<span>${l}</span>`).join('')}</div><h3>解曰</h3><p>${q.j}</p><p class="fine">签诗为本平台自创，仅供娱乐参考。真正求签请以庙方签诗和解签为准。</p>`);}
function showSummary(){const s=S.score;const rate=s>=95?'诚心满分':s>=80?'诚意十足':'心意已到，下次会更熟练';const L=[...S.lessons.values()];const q=S.qianOK?QIAN[S.qianNo-1]:null;
 openModal(`<h2>参拜圆满 · ${d.name}</h2><p>诚心值 <b style="color:var(--gold);font-size:20px">${s}</b> · ${rate}</p>
 ${S.report?`<h3>你的祈求</h3><p>${esc(S.report.wishes.join('、'))}</p>`:''}${q?`<h3>你的签</h3><p>第 ${S.qianNo} 签 <span class="lv">${q.lv}</span>：${q.p.join('，')}。</p>`:''}
 <h3>这次学到的禁忌</h3>${L.length?`<ul>${L.map(l=>`<li><b>${esc(l.title)}</b>：${esc(l.text)}</li>`).join('')}</ul>`:'<p>全程没有犯禁忌，很熟练！</p>'}
 <h3>还愿</h3><p>愿望达成后，记得回来答谢${d.call}：备上供品、上香，或添香油钱，都是还愿的方式。</p>
 <div class="mbtns"><button class="act primary" data-m="vow">记下这次的愿望</button>${d.bonus?`<button class="act" data-m="${d.bonus.act}">${d.bonus.label}</button>`:''}<button class="act" data-m="restart">再拜一次</button><button class="act" data-m="switch">换一尊神</button></div>
 <p class="fine">各庙习俗或有不同，以当地庙宇为准。Generated with Claude AI — please review before distribution.</p>`);}
async function resetScene(){hideBubble();hideJiao();W.qs.visible=false;for(const id of Object.keys(OBJ.offers)){const g=OBJ.offers[id];if(g.kain)W.kain.visible=false;else scene.remove(g);}
 OBJ.sticks.forEach(s=>s.g.parent&&s.g.parent.remove(s.g));OBJ.extra.forEach(e=>scene.remove(e));OBJ.offers={};OBJ.sticks=[];OBJ.hand=[];OBJ.burner={tg:[],main:[]};OBJ.extra=[];W.palms.visible=false;
 W.rsCandles.forEach(f=>f.obj.visible=false);W.spinToy=null;const L=W.templeStatue&&W.templeStatue.userData.lamps;if(L)L.forEach(f=>f.visible=false);
 const a=W.target&&W.target.userData.arm;if(a)a.rotation.set(0,0,0);S=fresh();render();}

/* =================== EVENTS =================== */
const onAct=e=>{const b=e.target.closest('[data-act]');if(!b||busyN||b.disabled)return;ac();const [n,...args]=b.dataset.act.split(':');if(A[n])A[n](...args);};
$('#trayBody').addEventListener('click',onAct);$('#trayMain').addEventListener('click',onAct);
$('#skipBtn').addEventListener('click',()=>{if(busyN||S.step>=d.steps.length-1)return;toast('info','已跳过「'+stepT(stepId()).t+'」','想学完整流程，可以之后再拜一次。');hideBubble();goStep(S.step+1);});
$('#trayBody').addEventListener('input',e=>{if(e.target.id==='qInput')S.question=e.target.value;});
document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.panel;
 if(k==='sop')openModal(`<h2>参拜 SOP · ${d.name}</h2><ol class="sop">${d.steps.map((s,i)=>{const t=stepT(s);return`<li class="${i<S.step?'d':i===S.step?'c':''}">${i<S.step?'✓ ':''}${t.t}<span>${t.d}</span></li>`;}).join('')}</ol><p class="fine">各庙习俗或有不同，以当地庙宇为准。Generated with Claude AI — please review before distribution.</p>`);
 else if(k==='bg')openModal(`<h2>${d.full}</h2><p class="alias">${d.alias}</p>${d.bg}<p class="fine">各庙习俗或有不同，以当地庙宇为准。</p>`);
 else openModal(`<h2>禁忌 · ${d.name}</h2><h3>拜${d.name}</h3>${d.taboo}${GENERAL_TABOO}`);}));
$('#sndBtn').addEventListener('click',()=>{soundOn=!soundOn;$('#sndBtn').textContent='声音 '+(soundOn?'开':'关');if(soundOn)ac();});
$('#switchBtn').addEventListener('click',()=>{if(!busyN)openIntro();});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')return closeModal();const m=e.target.closest('[data-m]');if(!m)return;const k=m.dataset.m;
 if(k==='close')closeModal();
 else if(k==='submitReport')submitReport();
 else if(k==='vow'){try{localStorage.setItem('tpk-vow',JSON.stringify({d:new Date().toISOString().slice(0,10),god:d.name,w:S.report?S.report.wishes:[],q:S.qianOK?S.qianNo:null}));toast('ok','记下了','下次打开这个页面会提醒你还愿。');}catch(err){toast('info','没能记下','这个浏览器不允许保存。');}}
 else{closeModal();if(!busyN&&A[k])A[k]();}});
$('#modal').addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='repForm')submitReport();});
function submitReport(){const err=$('#fErr');const val=k=>{const el=$('#f_'+k);return el?el.value.trim():'';};
 const wl=[...d.wishes,d.trap.label];const picked=[...document.querySelectorAll('#repForm input[name=wish]:checked')].map(i=>wl[+i.value]);
 for(const f of d.fields)if(f.req&&!val(f.k)){err.textContent=`请填写「${f.l}」。`;return;}
 if(!picked.length){err.textContent='至少选一项所求之事。';return;}
 if(picked.includes(d.trap.label)){taboo('trapwish',d.trap.title,d.trap.text,d.trap.deduct);err.textContent=`把「${d.trap.label}」取消，换成正当的祈求。`;return;}
 if(picked.length>3){taboo('greedy','求太多','祈求时心平气和，不贪多。挑最重要的一到三项就好。',3);err.textContent='最多选三项。';return;}
 const pr=$('#f_promise');if(d.promise&&pr&&!pr.checked){err.textContent='关公重信义，请勾选守信的承诺。';return;}
 const r={wishes:picked,extra:val('extra'),promise:!!(pr&&pr.checked)};d.fields.forEach(f=>r[f.k]=val(f.k));
 r.text=reportText(r);S.report=r;closeModal();showBubble(`你对${d.call}说`,r.text);toast('ok','禀告完毕','神明听得到，小声说或心里默念都可以。');render();}
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();});

/* =================== INTRO =================== */
let SEL=ORDER.includes((location.hash||'').slice(1))?location.hash.slice(1):'tpk';
function renderIntro(){$('#dgrid').innerHTML=ORDER.map(k=>`<button class="dcard ${k===SEL?'on':''}" data-d="${k}"><b>${D[k].name}</b><small>${D[k].alias.split(' · ').slice(-1)[0]}</small></button>`).join('');
 const dd=D[SEL];$('#pick').innerHTML=`<h2>${dd.full}</h2><p class="alias">${dd.alias}</p><p>${dd.blurb}</p><p class="fine">共 ${dd.steps.length} 个步骤${dd.scene==='roadside'?' · 地点：庙旁的拿督公神龛':''}</p>
  <button class="start" id="startBtn" ${worldReady?'':'disabled'}>${worldReady?'开始参拜':'庙宇布置中…'}</button>`;}
$('#dgrid').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;SEL=b.dataset.d;renderIntro();});
$('#pick').addEventListener('click',e=>{if(e.target.id!=='startBtn'||!worldReady)return;startDeity(SEL);});
function openIntro(){introOpen=true;$('#intro').hidden=false;$('#tray').hidden=true;hideBubble();SEL=DID;renderIntro();}
async function startDeity(id){ac();introOpen=false;$('#intro').hidden=true;await resetScene();DID=id;d=D[id];SC=SCN[d.scene];applyDeity(id);S=fresh();
 cam.pos.set(...FRONT.p);cam.tgt.set(...FRONT.t);cam.yaw=0;cam.pitch=0;cam.zoom=1;$('#tray').hidden=false;render();resize();bell();
 toast('info','欢迎来到'+d.temple,'跟着下方的步骤参拜。每一步的「下一步」按钮在面板右上方；拖动画面可以环顾四周。');}
try{const v=JSON.parse(localStorage.getItem('tpk-vow')||'null');if(v&&v.w&&v.w.length){const n=$('#vowNote');n.hidden=false;n.textContent=`你在 ${v.d} 向${v.god||'大伯公'}求了：${v.w.join('、')}。愿望达成的话，记得回来还愿。`;}}catch(e){}

/* =================== LOOP =================== */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;const v=2*Math.atan(Math.tan(31*PI/180)/camera.aspect)*180/PI;camera.fov=clamp(Math.max(55,v),55,86);
 const th=$('#tray').hidden?0:$('.trayIn').offsetHeight;const shift=Math.min(th*.42,h*.2);camera.setViewOffset(w,h,0,shift,w,h);camera.updateProjectionMatrix();}
addEventListener('resize',resize);if('ResizeObserver' in window)new ResizeObserver(()=>resize()).observe($('.trayIn'));
let last=performance.now(),T=0,worldReady=false;
let busyT=0;
function watchdog(dt){if(busyN>0){busyT+=dt;if(busyT>20){busyN=0;busyT=0;tweens.length=0;cam.bow=0;document.body.classList.remove('busy');render();toast('info','动画卡住了','已经帮你恢复，可以继续。');}}else busyT=0;}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;try{
 for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.dur);tw.fn(k);if(k>=1){tweens.splice(i,1);tw.res();}}
 if(introOpen)cam.yaw=Math.sin(T*.2)*.07;
 flames.forEach((f,i)=>{const s=1+Math.sin(T*13+i)*.07+Math.sin(T*23+i*2)*.05;f.obj.scale.set(1,s,1);if(f.light)f.light.intensity=f.base*(.85+Math.sin(T*17+i)*.08+Math.random()*.07);});
 lanterns.forEach((l,i)=>{l.rotation.z=Math.sin(T*.8+i)*.03;});if(W.spinToy)W.spinToy.rotation.z+=dt*4;
 OBJ.sticks.forEach(s=>{if(s.flame.visible)s.flame.scale.y=1+Math.sin(T*20+s.acc*9)*.15;});
 for(const f of fires){f.level+=(f.target-f.level)*Math.min(1,dt*3);f.g.visible=f.level>.01;if(!f.g.visible){f.light.intensity=0;continue;}
  f.cones.forEach(c=>{const u=c.userData;const k=f.level*(.75+.25*Math.sin(T*u.sp+u.ph))+rand(-.05,.05);c.scale.set(.6+f.level*.5,Math.max(.02,k),.6+f.level*.5);});f.light.intensity=f.level*f.base*(.85+Math.random()*.15);}
 sticksUpdate(dt);smokeUpdate(dt);
 if(!introOpen&&stepId()==='gold'&&!S.paper){const p=mainBurn();const b=$('#burnBar'),pc=$('#burnPct');if(b)b.style.width=Math.min(100,p*100)+'%';if(pc)pc.textContent=Math.min(100,Math.round(p*100));if(p>=.5&&!S.halfShown&&!busyN){S.halfShown=true;render();}}
 applyCam();renderer.render(scene,camera);}catch(err){if(!loop.warned){loop.warned=1;console.error(err);}}watchdog(dt);}

/* =================== BOOT =================== */
renderIntro();
const glyphs=[...new Set(Object.values(D).map(q=>[q.temple,q.lintel,q.cloth,...(q.couplet||[]),...(q.wall||[])].filter(Boolean).join('')).join('')+'龙门虎门天公炉香油金炉内殿拿督公九皇大帝春秋佛福大慈悲救苦难忠义协天帝上圣母海不扬波斗姆元君消灾解厄北斗九星招财进宝源广齐斩妖除魔中坛元帅护佑童安济活世酒慈关安财坛寿衣宝')].join('');
const pageLoaded=new Promise(r=>{if(document.readyState==='complete')r();else addEventListener('load',()=>r(),{once:true});});
const fontReady=Promise.race([pageLoaded.then(()=>(document.fonts&&document.fonts.load)?document.fonts.load(`900 64px "Noto Serif SC"`,glyphs):null),new Promise(r=>setTimeout(r,4000))]).catch(()=>{});
fontReady.then(()=>{buildWorld();applyDeity(SEL);worldReady=true;cam.pos.set(...FRONT.p);cam.tgt.set(...FRONT.t);resize();requestAnimationFrame(t=>{last=t;loop(t);});renderIntro();});
window.__dbg={S:()=>S,D,A,get d(){return d;},dayPillar,CAI_DIR,stepId,busy:()=>busyN};
})();
</script>
